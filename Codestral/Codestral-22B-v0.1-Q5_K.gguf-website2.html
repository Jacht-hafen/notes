<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kessel - Tea Brewing Timer</title>
    <style>
        :root {
            --color-primary: #357D46;
            --color-secondary: #FFCC99;
            --color-background: #FDF8F2;
            --color-text: #1A1B1C;
            --font-size-lg: 2rem;
            --font-size-md: 1.5rem;
        }
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--color-background);
            color: var(--color-text);
        }
        .container {
            max-width: 1200px;
            margin: auto;
            padding: 20px;
        }
        header h1 {
            font-size: var(--font-size-lg);
        }
        .cta {
            background-color: var(--color-primary);
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
        }
        .features {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
        }
        .feature {
            width: 30%;
            margin-bottom: 20px;
            padding: 20px;
            background-color: white;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .accordion {
            cursor: pointer;
            width: 100%;
            border: none;
            text-align: left;
            outline: none;
            padding: 18px;
            margin: 5px 0;
        }
        @media screen and (max-width: 700px) {
            .feature { width: 100%; }
        }
    </style>
</head>
<body>
    <header class="container">
        <h1>Kessel - The Perfect Tea Brewing Timer</h1>
        <p>Brew the perfect cup of tea every time with Kessel.</p>
        <button class="cta">Get Started</button>
    </header>
    <main class="container">
        <section class="features">
            <div class="feature">
                <!-- Feature card content -->
            </div>
            <!-- Repeat for other feature cards -->
        </section>
        <section class="faq">
            <h2>FAQ</h2>
            <button class="accordion">Question 1?</button>
            <div class="panel">Answer 1.</div>
            <!-- Repeat for other FAQ questions -->
        </section>
    </main>
    <footer class="container">
        <p>&copy; Kessel Tea Brewing Timer. All rights reserved.</p>
    </footer>
    <script>
        const accordions = document.getElementsByClassName('accordion');
        for (let i = 0; i < accordions.length; i++) {
            accordions[i].addEventListener('click', function() {
                this.classList.toggle('active');
                const panel = this.nextElementSibling;
                if (panel.style.display === 'block') {
                    panel.style.display = 'none';
                } else {
                    panel.style.display = 'block';
                }
            });
        }
    </script>
</body>
</html>
