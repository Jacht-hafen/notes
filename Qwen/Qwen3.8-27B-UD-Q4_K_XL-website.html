<html lang="en">

<style>
/* ============ TOKENS — the only place raw values live ============ */
:root{
  /* palette (all ≥4.5:1 against their backgrounds) */
  --c-paper:#FBF8F0;        /* page background            ~L .96 */
  --c-mist:#F0EBDE;         /* band / card surface        ~L .87 */
  --c-ink:#14261C;          /* primary text on light      L .02 → 14:1 */
  --c-ink-soft:#4A5B4E;     /* secondary text on light    L .09 → 6.9:1 */
  --c-line:#DCD4C2;         /* hairlines (decorative)     */
  --c-pine:#12291E;         /* dial face / dark UI        */
  --c-pine-deep:#0B1D14;    /* footer / ticker band       */
  --c-amber:#E8A34C;        /* accent on dark             → ~8:1 on pine-deep */
  --c-copper:#C2661B;       /* large graphics only (light bg) */
  --c-accent-deep:#8A3D0B;  /* accent text + button fill  → 7.2:1 with paper text */
  --c-accent-deeper:#6F2E06;/* button hover               */
  --c-leaf-green:#4F8A63;   /* sencha leaf                */
  --c-leaf-amber:#B45A1E;   /* oolong leaf                */
  --c-leaf-blossom:#C98A2D; /* chamomile leaf             */
  --c-steam:#CBD3CA;        /* decorative steam           */
  --c-tick:#3D5A4A;         /* dial tick marks            */
  --c-line-dark:#274136;    /* dial track ring            */
  --c-inv:#F4EFE3;          /* text on dark               → 15:1 */
  --c-inv-soft:#AFBDB0;     /* secondary on dark          → ~9:1 */
  --c-ring:#8A3D0B;         /* focus ring on light        */
  --c-glow:rgb(194 102 27 / .09);
  --sh-sm:0 2px 10px rgb(20 38 28 / .07);
  --sh-md:0 16px 36px -14px rgb(20 38 28 / .28);

  /* type */
  --font-display:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --font-body:ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif;
  --t-label:.75rem;
  --t-sm:.9375rem;
  --t-base:1.0625rem;
  --t-md:1.3125rem;
  --t-h3:clamp(1.35rem, 1.15rem + .8vw, 1.75rem);
  --t-h2:clamp(1.9rem, 1.4rem + 1.6vw, 2.9rem);
  --t-display:clamp(2.7rem, 1.7rem + 3.6vw, 4.6rem);
  --lh-tight:1.05;
  --lh-snug:1.3;
  --lh-body:1.68;
  --ls-tight:-.02em;
  --ls-caps:.17em;

  /* space */
  --s-1:.375rem; --s-2:.625rem; --s-3:1rem; --s-4:1.5rem;
  --s-5:2.25rem; --s-6:3.5rem; --s-7:5rem; --s-8:7rem;

  /* geometry */
  --px-1:1px; --px-2:2px; --px-3:3px; --px-4:4px;
  --w-1:1px; --w-2:2px; --w-3:3px;
  --r-sm:.5rem; --r-md:.9rem; --r-lg:1.4rem; --r-pill:999px;
  --maxw:74rem; --measure:58ch;
  --gutter:clamp(1.25rem, 4vw, 3rem);
  --head-h:4.25rem;
  --lift:-.4rem;
  --ul-off:.16em;

  /* motion */
  --e-1:.18s; --e-2:.45s;
  --dur-slow:4.5s;          /* idle steam loop            */
  --dur-ticker:30s;
  --dur-tick:.16s;          /* dial drain, matches ×8 tick*/

  /* svg stroke weights (unitless) */
  --sw-icon:2; --sw-track:9; --sw-tick:5;
}

/* ============ RESET / BASE ============ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:var(--head-h)}
body{
  font-family:var(--font-body);
  font-size:var(--t-base);
  line-height:var(--lh-body);
  color:var(--c-ink);
  background-color:var(--c-paper);
  overflow-x:clip;
}
img,svg{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
ul{list-style:none}
a{color:inherit;text-decoration:none}
::selection{background-color:var(--c-accent-deep);color:var(--c-paper)}

:focus-visible{
  outline:var(--w-3) solid var(--c-ring);
  outline-offset:var(--px-2);
  border-radius:var(--r-sm);
}
.site-footer :focus-visible, .ticker :focus-visible{outline-color:var(--c-amber)}

.sr-only{
  position:absolute;width:1px;height:1px;padding:0;margin:calc(0 - var(--px-2));
  overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;
}
.skip-link{
  position:fixed;top:var(--s-2);left:var(--s-2);z-index:100;
  transform:translateY(calc(-1 * var(--head-h)));
  background-color:var(--c-pine-deep);color:var(--c-inv);
  padding:var(--s-2) var(--s-3);border-radius:var(--r-sm);
  transition:transform var(--e-1) ease;
}
.skip-link:focus-visible{transform:none}

.wrap{width:min(var(--maxw), 100%);margin-inline:auto;padding-inline:var(--gutter)}
.eyebrow{
  display:flex;align-items:center;gap:var(--s-2);
  font-size:var(--t-label);font-weight:700;
  letter-spacing:var(--ls-caps);text-transform:uppercase;
  color:var(--c-accent-deep);margin-bottom:var(--s-3);
}
.eyebrow::before{content:"";width:2.25rem;height:var(--w-3);background-color:var(--c-copper)}

/* animated underline links */
.u-link{
  background-image:linear-gradient(var(--c-accent-deep), var(--c-accent-deep));
  background-size:0% var(--w-2);
  background-position:0 calc(100% - var(--px-1));
  background-repeat:no-repeat;
  transition:background-size var(--e-1) ease, color var(--e-1) ease;
}
.u-link:hover{background-size:100% var(--w-2);color:var(--c-accent-deep)}

/* ============ HEADER / NAV ============ */
.site-head{
  position:sticky;top:0;z-index:50;
  background-color:var(--c-paper);
  border-bottom:var(--w-1) solid var(--c-line);
  transition:box-shadow var(--e-2) ease;
}
.site-head.is-scrolled{box-shadow:var(--sh-sm)}
.head-in{min-height:var(--head-h);display:flex;align-items:center;gap:var(--s-4)}
.brand{display:flex;align-items:center;gap:var(--s-2);font-family:var(--font-display);font-size:var(--t-md);letter-spacing:var(--ls-tight);font-weight:700}
.brand svg{width:1.9rem;height:1.9rem;color:var(--c-pine)}
.nav-list{display:flex;align-items:center;gap:var(--s-5);margin-left:auto;font-size:var(--t-sm);font-weight:600}
.nav-list a:not(.btn){padding-block:var(--px-3)}
.btn-nav{
  display:inline-block;background-color:var(--c-pine);color:var(--c-inv);
  font-size:var(--t-sm);font-weight:700;letter-spacing:.02em;
  padding:var(--s-1) var(--s-3);border-radius:var(--r-pill);
  transition:background-color var(--e-1) ease, transform var(--e-1) ease;
}
.btn-nav:hover{background-color:var(--c-accent-deep)}
.nav-toggle{display:none;width:2.75rem;height:2.75rem;margin-left:auto;border-radius:var(--r-sm);color:var(--c-pine)}
.nav-toggle svg{width:100%;height:100%}
.nav-toggle .ln{transition:transform var(--e-2) ease, opacity var(--e-1) ease;transform-box:fill-box;transform-origin:center}
.site-head.is-open .nav-toggle .ln-a{transform:translateY(var(--px-4)) rotate(45deg)}
.site-head.is-open .nav-toggle .ln-b{opacity:0}
.site-head.is-open .nav-toggle .ln-c{transform:translateY(calc(-1 * var(--px-4))) rotate(-45deg)}

/* ============ HERO ============ */
.hero{position:relative;overflow:hidden;background-image:radial-gradient(var(--s-8) at 88% -12%, var(--c-glow), transparent 70%)}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:var(--s-6);align-items:center;padding-block:var(--s-7) var(--s-8)}
h1{
  font-family:var(--font-display);font-weight:600;
  font-size:var(--t-display);line-height:var(--lh-tight);letter-spacing:var(--ls-tight);
}
h1 em{font-style:italic;color:var(--c-accent-deep)}
.hero-sub{max-width:var(--measure);margin-top:var(--s-4);color:var(--c-ink-soft);font-size:var(--t-md);line-height:var(--lh-snug)}
.cta-row{margin-top:var(--s-5);display:flex;align-items:center;gap:var(--s-3);flex-wrap:wrap}
.btn-brew{
  background-color:var(--c-accent-deep);color:var(--c-paper);
  font-weight:700;font-size:var(--t-base);letter-spacing:.01em;
  padding:var(--s-2) var(--s-5);border-radius:var(--r-pill);
  box-shadow:var(--sh-sm);
  transition:background-color var(--e-1) ease, transform var(--e-1) ease, box-shadow var(--e-1) ease;
}
.btn-brew:hover{background-color:var(--c-accent-deeper);transform:translateY(var(--lift));box-shadow:var(--sh-md)}
.btn-brew:active{transform:none}
.cta-hint{font-size:var(--t-sm);color:var(--c-ink-soft)}

/* device stage */
.device-stage{position:relative;justify-self:center;width:min(100%, 24rem)}
.stage-ring{position:absolute;inset:calc(-1 * var(--s-5));pointer-events:none}
.stage-ring circle{fill:none;stroke:var(--c-line);stroke-width:var(--w-1)}
.device svg.dial-art{width:100%;height:auto;filter:drop-shadow(var(--sh-md))}
.steam path{
  fill:none;stroke:var(--c-steam);stroke-width:var(--sw-icon);stroke-linecap:round;opacity:0;
  animation:rise var(--dur-slow) ease-in-out infinite;
}
.steam path:nth-child(2){animation-delay:calc(var(--dur-slow) / -3)}
.steam path:nth-child(3){animation-delay:calc(var(--dur-slow) / -1.5)}
.device-stage.is-brewing .steam path{animation-duration:calc(var(--dur-slow) / 2.6);stroke:var(--c-amber)}
@keyframes rise{
  0%{transform:translateY(calc(1rem));opacity:0}
  35%{opacity:.85}
  100%{transform:translateY(calc(-1.4rem));opacity:0}
}
.dial-word{fill:var(--c-amber);font-family:var(--font-body);letter-spacing:.42em;font-weight:700}
.dial-time{fill:var(--c-amber);font-family:var(--font-display);font-weight:600;transform-box:fill-box;transform-origin:center}
.dial-note{fill:var(--c-inv-soft);letter-spacing:.32em;font-size:var(--t-label)}
.leaf-body{fill:var(--c-leaf-green);transition:fill var(--e-2) ease}
.leaf-vein{stroke:var(--c-pine-deep);stroke-width:var(--w-1);fill:none;stroke-linecap:round}
.device-stage[data-tea="oolong"] .leaf-body{fill:var(--c-leaf-amber)}
.device-stage[data-tea="chamomile"] .leaf-body{fill:var(--c-leaf-blossom)}
.ring-track{fill:none;stroke:var(--c-line-dark);stroke-width:var(--sw-track)}
.ring-progress{
  fill:none;stroke:var(--c-amber);stroke-width:var(--sw-track);stroke-linecap:round;
  transition:stroke-dashoffset var(--dur-tick) linear, stroke var(--e-2) ease;
}
.device-stage.is-done .ring-progress{stroke:var(--c-inv)}
.device-stage.is-done .dial-time{animation:pop calc(var(--e-2) * 1.6) ease}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.08)}100%{transform:scale(1)}}

.chips{display:flex;gap:var(--s-2);flex-wrap:wrap;margin-top:var(--s-4)}
.chip{
  display:inline-flex;align-items:center;gap:var(--s-1);
  background-color:var(--c-paper);border:var(--w-2) solid var(--c-line);
  border-radius:var(--r-pill);padding:var(--px-3) var(--s-2);
  font-size:var(--t-sm);font-weight:600;color:var(--c-ink);
  transition:border-color var(--e-1) ease, transform var(--e-1) ease, box-shadow var(--e-1) ease;
}
.chip svg{width:.8rem;height:.8rem}
.chip[data-tea="sencha"] circle{fill:var(--c-leaf-green)}
.chip[data-tea="oolong"] circle{fill:var(--c-leaf-amber)}
.chip[data-tea="chamomile"] circle{fill:var(--c-leaf-blossom)}
.chip:hover{transform:translateY(var(--lift))}
.chip[aria-pressed="true"]{border-color:var(--c-accent-deep);box-shadow:inset 0 0 0 var(--px-1) var(--c-accent-deep)}
.device-cap{margin-top:var(--s-3);font-size:var(--t-sm);color:var(--c-ink-soft);text-align:center}

/* ============ TICKER ============ */
.ticker{background-color:var(--c-pine-deep);border-block:var(--w-2) solid var(--c-copper);overflow:hidden;padding-block:var(--s-2)}
.ticker-track{display:flex;width:max-content;animation:tickerMove var(--dur-ticker) linear infinite}
.ticker:hover .ticker-track{animation-play-state:paused}
@keyframes tickerMove{to{transform:translateX(-50%)}}
.tick-list{display:flex;align-items:center;gap:var(--s-4);padding-inline:var(--s-2)}
.tick-item{display:inline-flex;align-items:center;gap:var(--s-3);white-space:nowrap;color:var(--c-amber);font-size:var(--t-sm);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.tick-item svg{width:.85rem;height:.85rem;color:var(--c-copper)}

/* ============ SECTIONS COMMON ============ */
section{padding-block:var(--s-7) var(--s-8)}
.sec-head{max-width:44ch;margin-bottom:var(--s-6)}
h2{font-family:var(--font-display);font-size:var(--t-h2);line-height:var(--lh-tight);letter-spacing:var(--ls-tight);font-weight:600}
.sec-head p{margin-top:var(--s-3);color:var(--c-ink-soft)}

/* ============ FEATURES ============ */
.features-grid{display:grid;grid-template-columns:1.2fr .95fr .95fr;gap:var(--s-4)}
.card{
  position:relative;background-color:var(--c-mist);border:var(--w-1) solid var(--c-line);
  border-radius:var(--r-lg);padding:calc(var(--s-4) + var(--s-2));overflow:hidden;
  transition:transform var(--e-2) ease, box-shadow var(--e-2) ease, border-color var(--e-2) ease;
}
.card::before{content:"";position:absolute;top:0;left:0;height:var(--w-3);width:2.75rem;background-color:var(--c-bar,var(--c-copper));transition:width var(--e-2) ease}
.card:hover{transform:translateY(var(--lift));box-shadow:var(--sh-md);border-color:transparent}
.card:hover::before{width:100%}
.card--green{--c-bar:var(--c-leaf-green)}
.card--pine{--c-bar:var(--c-pine)}
.card-top{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s-2);margin-bottom:var(--s-3)}
.card-num{font-family:var(--font-display);font-style:italic;font-size:var(--t-md);color:var(--c-accent-deep)}
.card-icon{width:2.75rem;height:2.75rem;color:var(--c-pine);transition:transform var(--e-2) ease}
.card:hover .card-icon{transform:translateY(var(--lift)) rotate(-4deg)}
.card h3{font-family:var(--font-display);font-size:var(--t-h3);line-height:var(--lh-snug);letter-spacing:var(--ls-tight);margin-bottom:var(--s-2)}
.card p{color:var(--c-ink-soft);font-size:var(--t-sm)}

/* ============ FAQ ============ */
.faq-band{background-color:var(--c-mist);border-block:var(--w-1) solid var(--c-line)}
.faq-list{max-width:46rem;display:grid;gap:var(--s-3)}
.faq-item{background-color:var(--c-paper);border:var(--w-1) solid var(--c-line);border-radius:var(--r-md);transition:border-color var(--e-2) ease, box-shadow var(--e-2) ease}
.faq-item.is-open{border-color:var(--c-accent-deep);box-shadow:var(--sh-sm)}
.faq-q{
  width:100%;display:flex;align-items:center;justify-content:space-between;gap:var(--s-3);
  text-align:left;padding:var(--s-3) var(--s-4);font-weight:
